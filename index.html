<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2B46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kai Ying Winning">

<title>Kai Ying Winning</title>
<meta name="description" content="A calibrated form book for Australian racing. Set the factors yourself; every price reprices on this device.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4EFE4; --surface:#FFFDF8; --ink:#141A22; --muted:#4E5866; --muted2:#7E8794; --rule:#DCD5C6;
  --panel:#0F2B46; --panel-ink:#F4EFE4; --panel-rule:rgba(244,239,228,0.16);
  --accent:#E8801A; --accent-ink:#141A22; --accent-soft:rgba(232,128,26,0.14);
  --good:#2F8F5B; --warn:#C27A0C; --bad:#C43C2F;
  --bar:#0F2B46; --bar-track:#E6DFD0; --bar-dyn:#E8801A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1A2B; --surface:#12243A; --ink:#F3EEE3; --muted:#BFC6D1; --muted2:#7E8794; --rule:rgba(243,238,227,0.14);
    --panel:#06111E; --panel-ink:#F3EEE3; --panel-rule:rgba(243,238,227,0.16);
    --accent:#FFA24A; --accent-ink:#141A22; --accent-soft:rgba(255,162,74,0.16);
    --good:#4FC48A; --warn:#F2B04C; --bad:#F27B6E;
    --bar:#F3EEE3; --bar-track:#1F3450; --bar-dyn:#FFA24A;
  }
}
:root[data-theme="dark"]{
  --ground:#0B1A2B; --surface:#12243A; --ink:#F3EEE3; --muted:#BFC6D1; --muted2:#7E8794; --rule:rgba(243,238,227,0.14);
  --panel:#06111E; --panel-ink:#F3EEE3; --panel-rule:rgba(243,238,227,0.16);
  --accent:#FFA24A; --accent-ink:#141A22; --accent-soft:rgba(255,162,74,0.16);
  --good:#4FC48A; --warn:#F2B04C; --bad:#F27B6E;
  --bar:#F3EEE3; --bar-track:#1F3450; --bar-dyn:#FFA24A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input:not([type=range]),select{font-size:16px}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:40px;font-weight:900} h2{font-size:28px} h3{font-size:22px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2)}
.eyebrow .sl{color:var(--accent);padding:0 6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-bottom:86px;min-height:100vh}
header.top{background:var(--panel);color:var(--panel-ink);padding:16px 18px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-bottom:4px solid var(--accent)}
header.top svg{width:56px;height:56px;display:block}
header.top .eyebrow{color:var(--panel-ink);opacity:.72}
header.top h1{color:var(--panel-ink)}
header.top .sub{opacity:.8;font-size:13px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header.top .refresh{background:none;border:1.5px solid rgba(244,239,228,.45);color:var(--panel-ink);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;letter-spacing:.6px;cursor:pointer}
header.top .refresh:active,header.top .refresh.busy{opacity:.55}
.pullhint{position:fixed;top:0;left:0;right:0;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--panel-ink);background:var(--accent);padding:6px;z-index:30;transform:translateY(-100%);transition:transform .2s}
.pullhint.show{transform:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted2);display:inline-block}
.sync.on::before{background:var(--good)} .sync.err::before{background:var(--bad)}
main{padding:14px 14px 20px}
section.block{margin-bottom:22px}
.rows{border-top:3px solid var(--ink)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit}
.row .idx{font-family:var(--display);font-weight:900;font-size:26px;color:var(--accent);line-height:1}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.row .r{text-align:right;font-size:12.5px;color:var(--muted)}
.row .r b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.3px}
.btn{border:1.5px solid var(--rule);background:var(--surface);padding:9px 13px;font-size:13.5px;font-weight:600;border-radius:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding:2px 7px;border:1.5px solid var(--rule);color:var(--muted);border-radius:4px;vertical-align:middle;margin-left:4px}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.good{border-color:var(--good);color:var(--good)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid var(--rule);background:var(--surface);padding:9px 10px;font-size:15.5px;color:var(--ink);width:100%;border-radius:6px;font-weight:400}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.note{color:var(--muted);font-size:13.5px}
.small{font-size:12.5px;color:var(--muted2)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);color:var(--panel-ink);display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--panel-rule);z-index:5}
nav.tabs button{background:none;border:0;color:var(--panel-ink);opacity:.62;font-family:var(--display);font-size:16px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;padding:8px 8px 6px;border-top:3px solid transparent}
nav.tabs button.on{opacity:1;border-top-color:var(--accent)}
nav.tabs button:focus-visible,.row:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cloth{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;font-family:var(--display);font-weight:900;font-size:22px;border-radius:5px 5px 9px 9px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);vertical-align:middle}
.runner{border-bottom:1px solid var(--rule);padding:12px 0}
.runner .head{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;min-width:0;font:inherit}
.runner.scr .nm{text-decoration:line-through;color:var(--muted2)}
.runner.scr .cloth{opacity:.35}
.runner .nm{font-weight:700;font-size:16.5px}
.runner .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.runner .prob{text-align:right}
.runner .prob b{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;display:block;letter-spacing:.3px}
.runner .prob span{display:block;font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;font-weight:600;white-space:nowrap}
.bar{height:5px;background:var(--bar-track);margin-top:8px;position:relative;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.bar i.dyn{background:var(--bar-dyn)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;padding:2px 7px;border:1.5px solid var(--rule);color:var(--muted);border-radius:4px;font-weight:500;background:none}
.chip.up{border-color:var(--good);color:var(--good)} .chip.dn{border-color:var(--bad);color:var(--bad)} .chip.acc{border-color:var(--accent);color:var(--accent)}
.chips button.chip{cursor:pointer}
.detail{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--rule)}
.metrics{display:grid;grid-template-columns:1fr 54px 1fr;gap:5px 10px;font-size:13px;align-items:center}
.metrics .z{text-align:right}
.metrics .zbar{height:7px;background:var(--bar-track);position:relative;border-radius:3px}
.metrics .zbar i{position:absolute;top:0;bottom:0;background:var(--good);border-radius:3px}
.metrics .zbar i.neg{background:var(--bad)}
.metrics .zbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted2)}
.adj{display:flex;align-items:center;gap:10px;margin-top:12px}
.adj input[type=range]{flex:1}
.adj b{font-family:var(--display);font-size:22px;min-width:36px;text-align:center}
input[type=range]{accent-color:var(--accent);width:100%}
.formbook{margin-top:10px;font-size:12.5px;border-top:1px solid var(--rule)}
.formbook .fl{display:grid;grid-template-columns:46px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.formbook .fl .pos{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.formbook .fl .pos.w{color:var(--good)} .formbook .fl .pos.t{color:var(--muted2)}
.formbook .fl .what{color:var(--muted)} .formbook .fl .what b{color:var(--ink);font-weight:600}
.formbook .fl .sp{font-weight:600;white-space:nowrap}
.wrow{padding:12px 0;border-bottom:1px solid var(--rule)}
.wrow .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wrow .l b{font-weight:700}
.wrow .l span{font-family:var(--display);font-size:22px;font-weight:800}
.wrow .d{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.wrow .delta{font-size:12.5px;color:var(--accent);font-weight:600}
.wrow .fit{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--muted2);margin-top:4px}
.wrow .fit.held{color:var(--good)} .wrow .fit.none{color:var(--warn)}
.wrow .l span small{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
.wtips{margin-top:8px}.wtip{display:grid;grid-template-columns:1fr 54px 56px 52px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}.wtip .idx{font-family:var(--display);font-weight:800;font-size:16px}.wtip .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wtip .num{text-align:right;font-weight:700}.wtip .muted{color:var(--muted2);font-weight:500}.wtips.edge .wtip{grid-template-columns:1fr 84px 52px 52px}
.wtip.hd{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);border-bottom:2px solid var(--rule);padding:4px 0}.wtip.hd .num{font-weight:600}.wtip.scr{opacity:.4;text-decoration:line-through}
.logrow{padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.logrow .when{font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.logrow ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink);border-bottom:1px solid var(--rule)}
.kpi{padding:12px 6px 12px 0}
.kpi b{display:block;font-family:var(--display);font-size:36px;font-weight:900;line-height:1}
.kpi span{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2);font-weight:700}
.banner{background:var(--panel);color:var(--panel-ink);padding:16px 18px;margin-bottom:16px;border-left:6px solid var(--accent);border-radius:0 8px 8px 0}
.banner h2{color:var(--panel-ink)}
.banner p{margin:6px 0 0;font-size:13.5px;opacity:.85}
.banner ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;opacity:.9}
.banner li{margin:3px 0}
.banner details summary{cursor:pointer;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;opacity:.8;margin-top:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 14px;font-size:13.5px;z-index:9;max-width:90vw;border-radius:8px;border-left:4px solid var(--accent)}
[hidden]{display:none!important}
pre.schema{font-size:11px;line-height:1.45;background:var(--surface);border:1.5px solid var(--rule);padding:10px;overflow-x:auto;white-space:pre;border-radius:6px}
.hdr-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.back{background:none;border:0;padding:0;color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.racehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.racehead .s{font-size:13px;color:var(--muted)}
.racehead .actions{display:flex;flex-wrap:nowrap;gap:6px;flex-shrink:0}
.bias{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.bias b{color:var(--ink)}
.switcher{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 0 4px;-webkit-overflow-scrolling:touch}
.switcher .btn{white-space:nowrap;flex:none;border-radius:999px;padding:7px 14px}
@media (max-width:420px){h1{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s cubic-bezier(.16,1,.3,1)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="26" cy="20" r="12" fill="#F4EFE4"/>
      <path d="M36 16 L62 26 L58 31 L36 25 Z" fill="#E8801A"/>
      <path d="M36 25 L58 31 L44 40 Q36 40 34 30 Z" fill="#F4B36B"/>
      <circle cx="29" cy="17" r="2.2" fill="#141A22"/>
      <path d="M14 30 Q4 44 14 58 L40 58 Q48 48 36 40 Q26 32 14 30 Z" fill="#F4EFE4"/>
      <path d="M26 46 Q34 44 40 50 L36 58 L22 58 Z" fill="#141A22"/>
      <path d="M22 40 Q30 36 38 42" stroke="#DCD5C6" stroke-width="2" fill="none"/>
    </svg>
    <div>
      <div class="eyebrow">Form book<span class="sl">/</span>Australian racing</div>
      <h1 id="hMeeting">Kai Ying Winning</h1>
      <div class="sub"><span id="hSub"></span><span class="sync" id="sync">connecting</span><button class="refresh" id="refreshBtn" type="button" aria-label="Refresh">&#8635; Refresh</button></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="races">Card</button>
  <button data-tab="race">Race</button>
  <button data-tab="weights">Model</button>
  <button data-tab="load">Feed</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script>
/* ============================================================
   Kai Ying Winning: a calibrated form book for Australian racing.
   Form, prices and results come from the feed (read only). The
   weights, notes and locked tips live on this device.
   ============================================================ */

// The factors the model rates. `base` is the default weight: the set that tested best on past race days (fitted on one
// month, checked on the next). `fit` says what the data showed for the factor; a slider is still yours to move.
const METRICS = [
  {key:'last',      label:'Last start',            base:0.7,   fit:'held', desc:'Finishing position, margin and field size last start, adjusted for a rise or drop in class today.'},
  {key:'form',      label:'Recent form',           base:1.125, fit:'held', desc:'Last five runs, most recent counting most. Spells are skipped.'},
  {key:'classform', label:'Class of recent runs',  base:0.9,   fit:'held', desc:'The grade of the last three races and how close the horse got. A narrow defeat in a Group 1 outranks a win in a benchmark race.'},
  {key:'career',    label:'Career strike rate',    base:0.6,   fit:'held', desc:'Career win and place percentages.'},
  {key:'track',     label:'Track record',          base:0.6,   fit:'held', desc:'Win and place rate at this track, shrunk toward average where starts are few.'},
  {key:'trackdist', label:'Track and distance',    base:0.35,  fit:'held', desc:'Record at this track over this distance.'},
  {key:'condition', label:'Track condition',       base:0,     fit:'none', desc:'Record on today\'s going. Showed no measured effect on the mostly dry days tested; turn it on for a wet track if you believe it matters.'},
  {key:'jockey',    label:'Jockey',                base:2.1,   fit:'thin', desc:'Jockey win percentage this season. Fitted high on a small sample and probably inflated; treat the default with suspicion.'},
  {key:'trainer',   label:'Trainer',               base:0.563, fit:'held', desc:'Trainer win percentage this season.'},
  {key:'barrier',   label:'Barrier',               base:0.45,  fit:'held', desc:'Inside draws favoured over short trips, fading with distance. The day\'s barrier bias, read from results, shifts this.'},
  {key:'barrierrec',label:'Record from this gate', base:0.9,   fit:'held', desc:'The horse\'s own record from this barrier number.'},
  {key:'weight',    label:'Weight carried',        base:0.4,   fit:'held', desc:'Weight relative to the field average.'},
  {key:'market',    label:'Opening market',        base:0.75,  fit:'held', desc:'Implied chance from the morning prices, refreshed once about 20 minutes before the race. At 0.75 it improved the return on past races without handing every tip to the favourite. Zero is pure form.'},
  {key:'formline',  label:'Form lines today',      base:1.0,   fit:'live', hidden:true, desc:'Horses out of the same last-start race as one that ran above or below expectation today, and riders winning on the day.'},
  {key:'manual',    label:'Your call',             base:1.0,   fit:'live', hidden:true, desc:'Your own plus or minus on a runner, set on the race screen.'}
];
const DEFAULT_SETTINGS = { marginRank:3, marginProb:0.12, lr:0.12, formlineGain:0.6, beta:2.2, autoAdapt:true, valueEdge:0.05, book:1.20, trust:0.5 };
const KELLY=0.25; // fraction of Kelly used by the unit allocator test
const BUILD='2026-09-22.1';
const SUPABASE = { url:'https://qgomklldlpspwilyjdqx.supabase.co', key:'sb_publishable_nhOXF3eXlHAyys2B0rzxxQ_W_Kb4OZP', flockCode:'pelicans-2026' };
// Standard saddlecloth colours (approximate; cosmetic only)
const CLOTH = {1:['#D7263D','#fff'],2:['#F7F5EF','#141A22'],3:['#1F4FCC','#fff'],4:['#F5C518','#141A22'],5:['#1E8B4B','#fff'],6:['#141A22','#F5C518'],7:['#F07A1A','#141A22'],8:['#F48FB1','#141A22'],9:['#3CC7C0','#141A22'],10:['#6A2C91','#fff'],11:['#9AA0A6','#B00020'],12:['#B6E51D','#141A22'],13:['#6D4322','#fff'],14:['#7B1F2B','#F5C518'],15:['#8B8455','#141A22'],16:['#B87333','#141A22'],17:['#0F2B46','#fff'],18:['#0F5132','#F5C518'],19:['#C9D6D2','#141A22'],20:['#D91E8B','#F5C518'],21:['#FF7F6E','#141A22'],22:['#E9E9E9','#141A22'],23:['#0F2B46','#F4EFE4'],24:['#D4AF37','#141A22']};

let state = { meetings:{}, meeting:null, feed:[], you:null, ui:{tab:'races', raceNo:1, open:null, meetingId:null, about:false}, updatedAt:0 };
let sb=null;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const num = v => (v===null||v===undefined||v===''||isNaN(+v)) ? null : +v;
const pct = p => (p*100).toFixed(p>=0.1?0:1)+'%';
const fmtOdds = p => p>0 ? '$'+(1/p).toFixed(1/p>=10?0:1) : '';
// the price a bookmaker framing the book at `book` (1.20 = 120%) would show for the model's chance
const ourPrice = (p,st,book) => { if(!(p>0)) return ''; const b=(book>1?book:null)||((st&&st.book)||1.2); const v=1/(p*b); return '$'+v.toFixed(v>=10?0:1); };

function isValue(s,settings){ return s.edge!=null && s.market>=0.05 && s.probValue>=0.10 && s.edge>=settings.valueEdge && s.probValue/s.market>=1.35; }

/* ---------------- run the day ----------------

/* Tips are fixed at the jump. The first time a race is seen past its start time (or with a result in), the ranking and roughie are written

  return `<div class="eyebrow" style="color:var(--panel-ink);opacity:.7;margin-top:12px">Tip trail</div><p style="margin-top:4px">${tr.map(t=>`${fmtTime(new Date(t.at).toISOString())} ${cloth(t.no)} ${nameOf(t.no)} <span class="small">(${why[t.why]||t.why})</span>`).join('<br>')}</p>`; }

  <div class="actions" style="margin:14px 0 6px"><button class="btn" id="planBtn" data-act="plantest" ${sb?'':'disabled'}>Test a 20-unit day plan</button><span class="small">A morning plan of 20 units across each archived day, one bet per race where your blended chance beats the market, sized at a quarter of Kelly.</span></div><div id="planOut">${state.ui.plan?planTestHTML(state.ui.plan,20):''}</div></section>`;
  html+=`<section class="block" style="margin-top:26px"><div class="eyebrow">Settings<span class="sl">/</span>adaptation, value and pricing</div><div class="rows" style="margin-top:8px">
    <div class="wrow"><div class="l"><b>Adapt weights from results</b><span><input type="checkbox" data-act="setting" data-key="autoAdapt" ${s.autoAdapt?'checked':''}></span></div><div class="d">A surprising result nudges your weights for the later races. A tip can move when that happens; the race screen shows when and why.</div></div>
    <div class="wrow"><div class="l"><b>Margin of error: rated position</b><span class="num">${s.marginRank}</span></div><div class="d">A winner rated this position or better is inside the margin and triggers no weight change.</div><input type="range" min="1" max="8" step="1" value="${s.marginRank}" data-act="setting" data-key="marginRank"></div>
    <div class="wrow"><div class="l"><b>Margin of error: rated chance</b><span class="num">${pct(s.marginProb)}</span></div><div class="d">A winner rated under this chance is outside the margin even if it was placed high.</div><input type="range" min="0.02" max="0.3" step="0.01" value="${s.marginProb}" data-act="setting" data-key="marginProb"></div>
    <div class="wrow"><div class="l"><b>Learning rate</b><span class="num">${s.lr.toFixed(2)}</span></div><div class="d">How far each surprising result moves the weights toward the factors that would have picked it.</div><input type="range" min="0.02" max="0.5" step="0.01" value="${s.lr}" data-act="setting" data-key="lr"></div>
    <div class="wrow"><div class="l"><b>Form line gain</b><span class="num">${s.formlineGain.toFixed(2)}</span></div><div class="d">How strongly a horse's run today carries to horses out of the same last-start race.</div><input type="range" min="0" max="1.5" step="0.05" value="${s.formlineGain}" data-act="setting" data-key="formlineGain"></div>
    <div class="wrow"><div class="l"><b>Trust in own rating</b><span class="num">${Math.round(s.trust*100)}%</span></div><div class="d">Value calls use a chance set between the form-only rating and the market. At 100% the market is ignored; at 50% a disagreement counts at half strength. Full trust lost money on past races, so start conservative.</div><input type="range" min="0.1" max="1" step="0.05" value="${s.trust}" data-act="setting" data-key="trust"></div>
    <div class="wrow"><div class="l"><b>Value threshold</b><span class="num">${(s.valueEdge*100).toFixed(0)} pts</span></div><div class="d">How far the blended chance must beat the market's before a runner is flagged as value.</div><input type="range" min="0.01" max="0.10" step="0.01" value="${s.valueEdge}" data-act="setting" data-key="valueEdge"></div>
    <div class="wrow"><div class="l"><b>Sharpness</b><span class="num">${s.beta.toFixed(2)}</span></div><div class="d">Higher concentrates the percentages on the top few; lower spreads them. The default was the best calibrated on past races.</div><input type="range" min="0.8" max="4" step="0.1" value="${s.beta}" data-act="setting" data-key="beta"></div>
    <div class="wrow"><div class="l"><b>Book percentage when no market</b><span class="num">${Math.round(s.book*100)}%</span></div><div class="d">Our prices are framed at the race's own book percentage from the live prices. This applies only when a race has no prices yet. 100% shows fair prices.</div><input type="range" min="1" max="1.4" step="0.01" value="${s.book}" data-act="setting" data-key="book"></div></div></section>`;
  if(run.changes&&run.changes.length){ html+=`<section class="block"><div class="eyebrow">What the results did to your model</div>`; for(const e of [...run.changes].reverse()){ html+=`<div class="logrow"><div class="when">Race ${e.race}</div>${esc(e.text)}${e.items.length?`<ul>${e.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}</div>`; } html+=`</section>`; }
  return html;
}

function viewLoad(){
  const ms=meetingsList().filter(x=>!x.example);
  let html=`<div class="eyebrow">Feed<span class="sl">/</span>racing.com and Racing Australia<span class="sl">/</span>build ${BUILD}</div>
  <p class="note" style="margin:8px 0 12px">Fields, fixed prices, scratchings and results come from racing.com for the meetings below: every metro meeting on Wednesdays and Saturdays, the richest card in each of NSW, Victoria, Queensland, the ACT and WA every day, and Hong Kong on Wednesdays and Sundays. Once a day the Racing Australia Free Fields form for each Australian meeting is read and attached to every runner: full career records and run-by-run lines with 600m times and in-running positions. Prices and results refresh every ten minutes during racing hours. Ratings are computed here from your weights.</p>
  <div class="rows">`;
  for(const m of ms){ const loaded=m.races.filter(r=>r.runners&&r.runners.length).length; const done=m.races.filter(r=>r.result).length; const withRa=m.races.reduce((a,r)=>a+r.runners.filter(x=>x.ra&&x.ra.runs).length,0);
    html+=`<button class="row" data-act="meeting" data-id="${esc(m.id)}" data-go="races"><span class="idx num">${m.sort&&m.sort<90?m.sort:''}</span><span><span class="t">${esc(m.meeting)}</span><br><span class="s">${esc(m.date?fmtDay(m.date):'')} ${esc(m.state||'')} ${esc(m.condition||'')}${m.rail?', rail '+esc(m.rail):''}. ${loaded}/${m.races.length} fields, ${done} results${withRa?', Free Fields form on '+withRa+' runners':''}.${m.syncedAt?' Read '+fmtTime(m.syncedAt)+'.':''}${m.manual?' Loaded by hand.':''}</span></span><span class="r"><b>${m.races.length}</b>races</span></button>`; }
  if(!ms.length) html+=`<p class="note" style="padding:10px 0">No meetings on the feed yet.</p>`;
  html+=`</div><div class="actions"><button class="btn" id="syncBtn" data-act="sync">Sync now</button><button class="btn" data-act="example">Open the fictional example</button></div>`;
  html+=`<details style="margin-top:26px"><summary class="eyebrow" style="cursor:pointer">Manual load<span class="sl">/</span>JSON, fallback only</summary>
  <p class="note" style="margin:8px 0 12px">Paste a meeting as JSON in the schema below. It is added alongside the feed and stays on this device only.</p>
  <label class="field">Form data<textarea id="loadIn" placeholder="Paste JSON here"></textarea></label>
  <div class="actions"><button class="btn primary" data-act="load">Load as a meeting</button><button class="btn" data-act="copyjson" ${state.meeting?'':'disabled'}>Copy current meeting as JSON</button><button class="btn danger" data-act="clear" ${state.meeting&&(state.meeting.manual||state.meeting.example)?'':'disabled'}>Remove current manual meeting</button></div>
  <pre class="schema" style="margin-top:12px">${esc(SCHEMA_DOC)}</pre>
  <p class="small">Records are [starts, wins, placings]. Form reads oldest to newest with the most recent run last.</p></details>`;
  html+=`<p class="small" style="margin-top:26px">Planned: a notes page, so the whole thing reads like a form book you have written in.</p>`;
  return html;
}

/* ---------------- events ---------------- */
function bind(root){
  root.querySelectorAll('[data-act="wrace"]').forEach(el=>el.addEventListener('click',()=>{ state.ui.raceNo=+el.dataset.no; const wt=document.getElementById('wtips'); if(wt){ wt.innerHTML=weightTipsHTML(); bind(wt); } }));
  root.querySelectorAll('[data-act="weight"]').forEach(el=>{ el.addEventListener('input',()=>{ me().weights[el.dataset.key]=+el.value; const sp=el.closest('.wrow').querySelector('.l span'); sp.innerHTML=weightWord(+el.value,+sp.dataset.base); const wt=document.getElementById('wtips'); if(wt){ wt.innerHTML=weightTipsHTML(); bind(wt); } }); el.addEventListener('change',()=>{ state.ui.prove=null; state.ui.plan=null; save(); }); });
  root.querySelectorAll('[data-act="setting"]').forEach(el=>{ const h=()=>{ me().settings[el.dataset.key]= el.type==='checkbox'?el.checked:+el.value; }; el.addEventListener('input',()=>{ h(); const sp=el.closest('.wrow').querySelector('.l span'); if(sp&&el.type!=='checkbox'){ const k=el.dataset.key; sp.textContent= k==='marginProb'?pct(+el.value):k==='marginRank'?el.value:k==='valueEdge'?(+el.value*100).toFixed(0)+' pts':k==='book'?Math.round(+el.value*100)+'%':k==='trust'?Math.round(+el.value*100)+'%':(+el.value).toFixed(2); } }); el.addEventListener('change',()=>{ h(); state.ui.prove=null; state.ui.plan=null; save(); }); });
  root.querySelectorAll('[data-act="adj"]').forEach(el=>{ el.addEventListener('input',()=>{ el.nextElementSibling.textContent=(+el.value>0?'+':'')+el.value; }); el.addEventListener('change',()=>{ const a=me().adj[el.dataset.key]||(me().adj[el.dataset.key]={adj:0,note:''}); a.adj=+el.value; save(); }); });
  root.querySelectorAll('[data-act="note"]').forEach(el=>el.addEventListener('change',()=>{ const a=me().adj[el.dataset.key]||(me().adj[el.dataset.key]={adj:0,note:''}); a.note=el.value; save(); }));
  root.querySelectorAll('[data-about]').forEach(el=>el.addEventListener('toggle',()=>{ state.ui.about=el.open; }));
}
function currentRace(){ return state.meeting.races.find(r=>r.no===state.ui.raceNo)||state.meeting.races[0]; }
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  if(act==='tab'){ state.ui.tab=b.dataset.tab; render(); }
  else if(act==='openrace'){ state.ui.raceNo=+b.dataset.no; state.ui.tab='race'; state.ui.open=null; render(); window.scrollTo(0,0); }
  else if(act==='toggle'){ state.ui.open= state.ui.open===b.dataset.key?null:b.dataset.key; render(); }
  else if(act==='scratch'){ const r=currentRace().runners.find(x=>x.no===+b.dataset.no); r.scratched=!r.scratched; save(); }
  else if(act==='resetweights'){ me().weights=Object.fromEntries(METRICS.map(m=>[m.key,m.base])); state.ui.prove=null; state.ui.plan=null; save(); }
  else if(act==='load'){ try{ loadText($('#loadIn').value); }catch(err){ toast('Could not read that: '+err.message); } }
  else if(act==='example'){ const ex=exampleMeeting(); putMeeting(ex); selectMeeting(ex.id); state.ui.tab='races'; persistLocal(); render(); }
  else if(act==='meeting'){ selectMeeting(b.dataset.id); state.ui.open=null; if(b.dataset.go) state.ui.tab=b.dataset.go; persistLocal(); render(); }
  else if(act==='sync'){ await syncNow(); }
  else if(act==='plantest'){ const btn=$('#planBtn'); if(btn){ btn.disabled=true; btn.textContent='Running...'; } try{ const past=await loadPast(); if(!past||!past.length){ toast('No past meetings stored yet'); } else { state.ui.plan=testPlan(me(),past,20); } }catch(e){ console.error(e); toast('Test failed'); } render(); }
  else if(act==='prove'){ const btn=$('#proveBtn'); if(btn){ btn.disabled=true; btn.textContent='Running...'; } try{ const past=await loadPast(); if(!past||!past.length){ toast('No past meetings stored yet'); } else { state.ui.prove=evaluatePunter(me(),past); } }catch(e){ console.error(e); toast('Could not load past meetings'); } render(); }
  else if(act==='clear'){ if(!state.meeting||!(state.meeting.manual||state.meeting.example)) return; if(!confirm('Remove this meeting from this device?')) return; delete state.meetings[state.meeting.id]; selectMeeting(null); persistLocal(); render(); }
  else if(act==='copyjson'){ await copy(JSON.stringify(state.meeting,null,1)); toast('Meeting JSON copied'); }
});
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.ui.tab=b.dataset.tab; if(b.dataset.tab==='races') state.ui.seenAbout=true; render(); window.scrollTo(0,0); });
async function copy(text){ try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } }

/* ---------------- boot ---------------- */
(async function boot(){
  loadLocal(); if(!state.you) state.you=newYou();
  render(); const rb=$('#refreshBtn'); if(rb) rb.addEventListener('click',refreshNow); bindPullToRefresh(); checkForUpdate(); await sbInit();
  if(!sb) setSync('','this device only');
})();
</script>
</body>
</html>
