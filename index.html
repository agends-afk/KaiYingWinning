<title>Kai Ying Winning</title>
<meta name="description" content="The Pelicans' form model for the Saturday metros">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4EFE4; --surface:#FFFDF8; --ink:#141A22; --muted:#4E5866; --muted2:#7E8794; --rule:#DCD5C6;
  --panel:#0F2B46; --panel-ink:#F4EFE4; --panel-rule:rgba(244,239,228,0.16);
  --accent:#E8801A; --accent-ink:#141A22; --accent-soft:rgba(232,128,26,0.14);
  --good:#2F8F5B; --warn:#C27A0C; --bad:#C43C2F;
  --bar:#0F2B46; --bar-track:#E6DFD0; --bar-dyn:#E8801A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1A2B; --surface:#12243A; --ink:#F3EEE3; --muted:#BFC6D1; --muted2:#7E8794; --rule:rgba(243,238,227,0.14);
    --panel:#06111E; --panel-ink:#F3EEE3; --panel-rule:rgba(243,238,227,0.16);
    --accent:#FFA24A; --accent-ink:#141A22; --accent-soft:rgba(255,162,74,0.16);
    --good:#4FC48A; --warn:#F2B04C; --bad:#F27B6E;
    --bar:#F3EEE3; --bar-track:#1F3450; --bar-dyn:#FFA24A;
  }
}
:root[data-theme="dark"]{
  --ground:#0B1A2B; --surface:#12243A; --ink:#F3EEE3; --muted:#BFC6D1; --muted2:#7E8794; --rule:rgba(243,238,227,0.14);
  --panel:#06111E; --panel-ink:#F3EEE3; --panel-rule:rgba(243,238,227,0.16);
  --accent:#FFA24A; --accent-ink:#141A22; --accent-soft:rgba(255,162,74,0.16);
  --good:#4FC48A; --warn:#F2B04C; --bad:#F27B6E;
  --bar:#F3EEE3; --bar-track:#1F3450; --bar-dyn:#FFA24A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:40px;font-weight:900} h2{font-size:28px} h3{font-size:22px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2)}
.eyebrow .sl{color:var(--accent);padding:0 6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-bottom:86px;min-height:100vh}
header.top{background:var(--panel);color:var(--panel-ink);padding:16px 18px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-bottom:4px solid var(--accent)}
header.top svg{width:56px;height:56px;display:block}
header.top .eyebrow{color:var(--panel-ink);opacity:.72}
header.top h1{color:var(--panel-ink)}
header.top .sub{opacity:.8;font-size:13px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted2);display:inline-block}
.sync.on::before{background:var(--good)} .sync.err::before{background:var(--bad)}
main{padding:14px 14px 20px}
section.block{margin-bottom:22px}
.rows{border-top:3px solid var(--ink)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .idx{font-family:var(--display);font-weight:900;font-size:26px;color:var(--accent);line-height:1}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.row .r{text-align:right;font-size:12.5px;color:var(--muted)}
.row .r b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.3px}
.btn{border:1.5px solid var(--rule);background:var(--surface);padding:9px 13px;font-size:13.5px;font-weight:600;border-radius:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding:2px 7px;border:1.5px solid var(--rule);color:var(--muted);border-radius:4px;vertical-align:middle}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.good{border-color:var(--good);color:var(--good)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid var(--rule);background:var(--surface);padding:9px 10px;font-size:15.5px;color:var(--ink);width:100%;border-radius:6px;font-weight:400}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.note{color:var(--muted);font-size:13.5px}
.small{font-size:12.5px;color:var(--muted2)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);color:var(--panel-ink);display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--panel-rule);z-index:5}
nav.tabs button{background:none;border:0;color:var(--panel-ink);opacity:.62;font-family:var(--display);font-size:16px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;padding:8px 8px 6px;border-top:3px solid transparent}
nav.tabs button.on{opacity:1;border-top-color:var(--accent)}
nav.tabs button:focus-visible,.row:focus-visible,.btn:focus-visible,.cloth:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* saddlecloth */
.cloth{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;font-family:var(--display);font-weight:900;font-size:22px;border-radius:5px 5px 9px 9px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);flex:none;letter-spacing:0}
.runner{border-bottom:1px solid var(--rule);padding:12px 0}
.runner .top{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:start}
.runner .head{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;min-width:0}
.tipbtn{height:56px;border:2px solid var(--rule);background:var(--surface);border-radius:8px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0;line-height:1.05}
.tipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tipbtn.pl{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tipbtn:disabled{opacity:.4}
.tipsboard{overflow-x:auto}
.tipsboard table{border-collapse:collapse;width:100%;font-size:13px}
.tipsboard th,.tipsboard td{padding:6px 6px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
.tipsboard th{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2)}
.tipsboard td:first-child{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent);text-align:left}
.tipsboard .hit{outline:2px solid var(--good);outline-offset:-2px}
.tipsboard .cloth{width:30px;height:26px;font-size:16px}
.runner.scr .nm{text-decoration:line-through;color:var(--muted2)}
.runner.scr .cloth{opacity:.35}
.runner .nm{font-weight:700;font-size:16.5px}
.runner .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.runner .prob{text-align:right}
.runner .prob b{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;display:block;letter-spacing:.3px}
.runner .prob span{font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.bar{height:5px;background:var(--bar-track);margin-top:8px;position:relative;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.bar i.dyn{background:var(--bar-dyn)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;padding:2px 7px;border:1.5px solid var(--rule);color:var(--muted);border-radius:4px;font-weight:500}
.chip.up{border-color:var(--good);color:var(--good)} .chip.dn{border-color:var(--bad);color:var(--bad)} .chip.acc{border-color:var(--accent);color:var(--accent)}
.flock{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pel{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 7px 1px 3px;border-radius:12px;background:var(--surface);border:1.5px solid var(--rule)}
.pel i{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.15)}
.detail{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--rule)}
.metrics{display:grid;grid-template-columns:1fr 54px 1fr;gap:5px 10px;font-size:13px;align-items:center}
.metrics .z{text-align:right}
.metrics .zbar{height:7px;background:var(--bar-track);position:relative;border-radius:3px}
.metrics .zbar i{position:absolute;top:0;bottom:0;background:var(--good);border-radius:3px}
.metrics .zbar i.neg{background:var(--bad)}
.metrics .zbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted2)}
.adj{display:flex;align-items:center;gap:10px;margin-top:12px}
.adj input[type=range]{flex:1}
.adj b{font-family:var(--display);font-size:22px;min-width:36px;text-align:center}
input[type=range]{accent-color:var(--accent);width:100%}
.wrow{padding:12px 0;border-bottom:1px solid var(--rule)}
.wrow .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wrow .l b{font-weight:700}
.wrow .l span{font-family:var(--display);font-size:22px;font-weight:800}
.wrow .d{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.wrow .delta{font-size:12.5px;color:var(--accent);font-weight:600}
.result-entry{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.result-entry .field{flex:1;min-width:150px}
.logrow{padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.logrow .when{font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.logrow ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink);border-bottom:1px solid var(--rule)}
.kpi{padding:12px 6px 12px 0}
.kpi b{display:block;font-family:var(--display);font-size:36px;font-weight:900;line-height:1}
.kpi span{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2);font-weight:700}
.banner{background:var(--panel);color:var(--panel-ink);padding:16px 18px;margin-bottom:16px;border-left:6px solid var(--accent);border-radius:0 8px 8px 0}
.banner h2{color:var(--panel-ink)}
.banner p{margin:6px 0 0;font-size:13.5px;opacity:.85}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 14px;font-size:13.5px;z-index:9;max-width:90vw;border-radius:8px;border-left:4px solid var(--accent)}
[hidden]{display:none!important}
pre.schema{font-size:11px;line-height:1.45;background:var(--surface);border:1.5px solid var(--rule);padding:10px;overflow-x:auto;white-space:pre;border-radius:6px}
.hdr-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.back{background:none;border:0;padding:0;color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.racehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.racehead .s{font-size:13px;color:var(--muted)}
.bias{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.bias b{color:var(--ink)}
.board{border-top:3px solid var(--ink)}
.board .brow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.board .brow .pos{font-family:var(--display);font-size:24px;font-weight:900;color:var(--accent)}
.board .brow .pts{font-family:var(--display);font-size:26px;font-weight:900;text-align:right}
.board .brow .sub{font-size:12.5px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(6,17,30,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--ground);color:var(--ink);width:100%;max-width:560px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;border-top:5px solid var(--accent)}
.sheet .who{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tipbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.avatar{width:40px;height:40px;display:inline-block;vertical-align:middle;flex:none}
.avatar.sm{width:22px;height:22px}
.pel .avatar.sm{margin-left:-2px}
.who .btn{display:flex;align-items:center;gap:8px;padding:8px 12px}
.comment{padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start}
.comment .by{font-weight:700}
.comment .t{color:var(--muted2);font-size:11px}
.comment button{background:none;border:0;color:var(--muted2);font-size:12px;padding:0}
.cform{display:flex;gap:8px;margin-top:8px}
.cform input{flex:1}
.betform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.betform .field{font-size:12px}
.betrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.betrow .amt{font-family:var(--display);font-size:20px;font-weight:800;text-align:right;white-space:nowrap}
.betrow .amt.pos{color:var(--good)} .betrow .amt.neg{color:var(--bad)}
.betrow .s{font-size:12.5px;color:var(--muted)}
.club{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
@media (max-width:420px){h1{font-size:34px}.betform{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s cubic-bezier(.16,1,.3,1)}}
</style>

<script>
/* ============================================================
   Kai Ying Winning: the Pelicans' form model
   One shared form and shared results. Each Pelican keeps their
   own weights, adjustments and tips, and each model adapts to
   results on its own margin settings.
   ============================================================ */

const METRICS = [
  {key:'last',      label:'Last start',         base:1.4, desc:'Finishing position, margin and field size last start, adjusted for a rise or drop in class today.'},
  {key:'form',      label:'Recent form',        base:1.0, desc:'Last five runs, most recent counting most. Spells are skipped.'},
  {key:'track',     label:'Track record',       base:0.8, desc:'Win and place rate at this track, shrunk toward average where starts are few.'},
  {key:'distance',  label:'Distance record',    base:0.9, desc:'Win and place rate at this distance, shrunk the same way.'},
  {key:'condition', label:'Track condition',    base:0.9, desc:'Record on today\'s going, taken from the meeting condition on the Card tab.'},
  {key:'career',    label:'Career strike rate', base:0.6, desc:'Career win and place percentages.'},
  {key:'jockey',    label:'Jockey',             base:0.7, desc:'Jockey win percentage or rating from the form.'},
  {key:'trainer',   label:'Trainer',            base:0.5, desc:'Trainer win percentage or rating from the form.'},
  {key:'barrier',   label:'Barrier',            base:0.6, desc:'Inside draws favoured over short trips, fading with distance. The day\'s barrier bias shifts this.'},
  {key:'weight',    label:'Weight carried',     base:0.4, desc:'Weight relative to the field average.'},
  {key:'fitness',   label:'Freshness',          base:0.5, desc:'Days since last run. Fourteen to twenty-eight is treated as ideal; first-up runs are marked down.'},
  {key:'market',    label:'Market',             base:0.8, desc:'Implied chance from the odds, where odds are in the form.'},
  {key:'formline',  label:'Form lines today',   base:1.0, desc:'Live: horses out of the same last-start race as one that ran above or below expectation today, and riders winning on the day.'},
  {key:'manual',    label:'Your call',          base:1.0, desc:'Your own plus or minus on a runner, set on the race screen.'}
];
const DEFAULT_SETTINGS = { marginRank:3, marginProb:0.12, lr:0.18, formlineGain:0.6, beta:2.2, autoAdapt:true, bank:200, kelly:0.25, valueEdge:0.03, book:1.20 };
const PUNTER_COLOURS = ['#E8801A','#2F8F5B','#3B6FD4','#C43C2F','#8E5BC6','#D4A72C','#1BA5A5','#D45FA0','#6B7F2E','#8C5A2B'];
// Web-hosted backend. Filled in once the Supabase project is chosen. Empty url = no shared backend.
const SUPABASE = { url:'https://qgomklldlpspwilyjdqx.supabase.co', key:'sb_publishable_nhOXF3eXlHAyys2B0rzxxQ_W_Kb4OZP', flockCode:'pelicans-2026' };
// The roster. Anyone else can still add a name on the roll call.
const ROSTER = [
  {id:'mick',     name:'Mick',     colour:'#3B6FD4', avatar:'cap'},
  {id:'wilko',    name:'Wilko',    colour:'#2F8F5B', avatar:'shades'},
  {id:'big-dog',  name:'Big Dog',  colour:'#8E5BC6', avatar:'crown'},
  {id:'shirty',   name:'Shirty',   colour:'#E8801A', avatar:'shirty'}
];
function avatarSVG(kind, colour, cls){ // a pelican head with an accessory per Pelican
  const base=`<circle cx="32" cy="32" r="30" fill="${colour}"/><circle cx="28" cy="30" r="14" fill="#F4EFE4"/><path d="M40 27 L62 34 L58 39 L40 34 Z" fill="#E8801A"/><path d="M40 34 L58 39 L46 46 Q40 45 38 38 Z" fill="#F4B36B"/><circle cx="31" cy="26" r="2.4" fill="#141A22"/>`;
  const acc={
    bowtie:`<path d="M22 50 L30 54 L22 58 Z M38 50 L30 54 L38 58 Z" fill="#141A22"/><circle cx="30" cy="54" r="2" fill="#F4EFE4"/>`,
    cap:`<path d="M12 22 Q28 4 44 20 L44 24 L12 24 Z" fill="#141A22"/><path d="M8 22 L20 22 L20 26 L6 27 Z" fill="#141A22"/>`,
    shades:`<rect x="20" y="22" width="12" height="8" rx="3" fill="#141A22"/><rect x="34" y="23" width="9" height="7" rx="3" fill="#141A22"/><path d="M32 26 L34 26" stroke="#141A22" stroke-width="2"/>`,
    crown:`<path d="M16 20 L21 8 L28 16 L34 6 L40 16 L46 10 L44 22 Z" fill="#F5C518" stroke="#141A22" stroke-width="1.5"/>`,
    shirty:`<path d="M18 46 L28 54 L38 46 L34 44 L28 50 L22 44 Z" fill="#F4EFE4" stroke="#141A22" stroke-width="1.5"/><path d="M28 54 L26 62 L30 62 Z" fill="#141A22"/><path d="M24 20 L30 23 M38 21 L34 23" stroke="#141A22" stroke-width="2.4" stroke-linecap="round"/>`,
    plain:``
  };
  return `<svg class="avatar ${cls||''}" viewBox="0 0 64 64" aria-hidden="true">${base}${acc[kind]||''}</svg>`;
}
// Standard saddlecloth colours (approximate; cosmetic only)

let state = { meeting:null, punters:{}, me:null, comments:[], bets:[], ui:{tab:'races', raceNo:1, open:null, betOn:null}, updatedAt:0 };
let db=null, sb=null, saveTimer=null, sampleFn=null;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const num = v => (v===null||v===undefined||v===''||isNaN(+v)) ? null : +v;
const pct = p => (p*100).toFixed(p>=0.1?0:1)+'%';
const fmtOdds = p => p>0 ? '$'+(1/p).toFixed(1/p>=10?0:1) : '';
// the price a bookmaker framing the book at `book` (1.20 = 120%) would show for the model's chance
const ourPrice = (p,st) => p>0 ? '$'+(1/(p*((st&&st.book)||1.2))).toFixed(1/(p*1.2)>=10?0:1) : '';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2800); }
function rec(v){ if(!v) return null; if(Array.isArray(v)) return {s:num(v[0])||0,w:num(v[1])||0,p:num(v[2])||0};
  if(typeof v==='string'){ const m=v.split(/[-:/ ]+/).map(num); if(m.length>=3) return {s:m[0]||0,w:m[1]||0,p:m[2]||0}; return null; }
  if(typeof v==='object') return {s:num(v.starts??v.s)||0,w:num(v.wins??v.w)||0,p:num(v.places??v.p)||0}; return null; }
function condCategory(cond){ const c=String(cond||'').toLowerCase(); if(c.startsWith('h')) return 'heavy'; if(c.startsWith('so')||c.startsWith('sl')||c.startsWith('sy')) return 'soft'; return 'good'; }
function normKey(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function active(race){ return race.runners.filter(r=>!r.scratched); }
function runnerKey(race,r){ return 'r'+race.no+'_'+r.no; }
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'x'; }
function titleCase(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
function cloth(no){ const c=CLOTH[no]||['#DCD5C6','#141A22']; return `<span class="cloth num" style="background:${c[0]};color:${c[1]}">${no}</span>`; }
function me(){ return state.punters[state.me]; }
function newPunter(name){ const r=ROSTER.find(x=>x.id===slug(name)); const used=Object.values(state.punters).map(p=>p.colour); const colour=r?r.colour:(PUNTER_COLOURS.find(c=>!used.includes(c))||PUNTER_COLOURS[Object.keys(state.punters).length%PUNTER_COLOURS.length]);
  return {id:slug(name), name:r?r.name:name.trim(), colour, avatar:r?r.avatar:'plain', weights:Object.fromEntries(METRICS.map(m=>[m.key,m.base])), settings:{...DEFAULT_SETTINGS}, adj:{}, picks:{}, updatedAt:Date.now()}; }
function ensureRoster(){ for(const r of ROSTER){ if(!state.punters[r.id]) state.punters[r.id]=newPunter(r.name); } }
function pelChip(p){ return `<span class="pel">${avatarSVG(p.avatar||'plain',p.colour,'sm')}${esc(p.name)}</span>`; }
function punterByName(n){ return Object.values(state.punters).find(p=>p.name===n)||{name:n,colour:'#7E8794',avatar:'plain'}; }

/* ---------------- scoring ---------------- */
function rate(w,s,prior,k){ return (w + prior*k)/(s + k); }
function recScore(r){ if(!r||r.s===0) return null; const wr=rate(r.w,r.s,0.12,4), pr=rate(r.w+r.p,r.s,0.38,4); return 0.5*clamp(wr/0.3,0,1)+0.5*clamp(pr/0.6,0,1); }
const FORM_PTS = {'1':1,'2':.75,'3':.6,'4':.45,'5':.35,'6':.25,'7':.2,'8':.15,'9':.12,'0':.08};
function formScore(f){ if(!f) return null; const runs=String(f).replace(/[^0-9a-zA-Z]/g,'').split('').filter(c=>!/x/i.test(c)).slice(-5); if(!runs.length) return null;
  const ws=[.1,.15,.2,.25,.3].slice(-runs.length); let tot=0,sw=0; runs.forEach((c,i)=>{ tot+=(FORM_PTS[c]??0.1)*ws[i]; sw+=ws[i]; }); return tot/sw; }
function lastScore(l){ if(!l||num(l.pos)==null) return null; const pos=num(l.pos), field=num(l.field)||12, margin=num(l.margin);
  const posS=pos<=1?1:clamp(1-(pos-1)/Math.max(field-1,1),0,1); const marS=margin==null?posS:clamp(1-margin/10,0,1);
  return clamp(0.5*posS+0.5*marS-0.1*(num(l.classChange)||0),0,1); }
function fitnessScore(l){ const d=l?num(l.days):null; if(d==null) return null; if(d<7) return .55; if(d<14) return .8; if(d<=28) return 1; if(d<=42) return .8; if(d<=90) return .55; return .4; }
function distanceFactor(dist){ const d=num(dist)||1400; if(d<=1200) return 1; if(d<=1400) return .8; if(d<=1600) return .6; if(d<=2000) return .45; return .3; }
function barrierScore(r,race,n,bias){ const b=num(r.barrier); if(b==null||n<2) return null; const rel=clamp((b-1)/(n-1),0,1); const eff=clamp(distanceFactor(race.distance)*0.6+(bias||0),-1,1); return clamp(0.5-(rel-0.5)*eff,0,1); }
function jockeyScore(r){ const p=num(r.jockeyPct); if(p!=null) return clamp(p/25,0,1); const g=num(r.jockeyRating); if(g!=null) return clamp(g/100,0,1); return null; }
function trainerScore(r){ const p=num(r.trainerPct); if(p!=null) return clamp(p/20,0,1); const g=num(r.trainerRating); if(g!=null) return clamp(g/100,0,1); return null; }
function zscores(vals){ const xs=vals.filter(v=>v!=null); if(xs.length<2) return vals.map(()=>0); const m=xs.reduce((a,b)=>a+b,0)/xs.length; const sd=Math.sqrt(xs.reduce((a,b)=>a+(b-m)**2,0)/xs.length)||0; if(sd<1e-9) return vals.map(()=>0); return vals.map(v=>v==null?0:clamp((v-m)/sd,-2.5,2.5)); }

function scoreRace(race, meeting, weights, settings, dyn, adj){
  const rs=active(race); const n=rs.length; const cat=condCategory(meeting.condition);
  const ws=rs.map(r=>num(r.weight)).filter(v=>v!=null); const meanW=ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:null;
  const maxImp=Math.max(...rs.map(r=>{const o=num(r.odds); return o>1?1/o:0;}),0);
  const raw={};
  raw.last=rs.map(r=>lastScore(r.last)); raw.form=rs.map(r=>formScore(r.form)); raw.track=rs.map(r=>recScore(rec(r.track))); raw.distance=rs.map(r=>recScore(rec(r.distance)));
  raw.condition=rs.map(r=>recScore(rec(r[cat])||rec(r.cond)||(r.condition&&rec(r.condition[cat])))); raw.career=rs.map(r=>recScore(rec(r.career)));
  raw.jockey=rs.map(jockeyScore); raw.trainer=rs.map(trainerScore); raw.barrier=rs.map(r=>barrierScore(r,race,n,dyn.barrierBias));
  raw.weight=rs.map(r=>{const w=num(r.weight); return (w==null||meanW==null)?null:clamp(0.5+(meanW-w)/6,0,1);}); raw.fitness=rs.map(r=>fitnessScore(r.last));
  raw.market=rs.map(r=>{const o=num(r.odds); return (o>1&&maxImp>0)?(1/o)/maxImp:null;});
  const z={}; for(const k of Object.keys(raw)) z[k]=zscores(raw[k]);
  z.formline=rs.map(r=>clamp(dyn.formline[runnerKey(race,r)]||0,-2,2));
  z.manual=rs.map(r=>((adj&&adj[runnerKey(race,r)]&&num(adj[runnerKey(race,r)].adj))||0)*0.5);
  const wsum=METRICS.reduce((a,m)=>a+(weights[m.key]||0),0)||1;
  const scored=rs.map((r,i)=>{ let rating=0; const contrib={}; for(const m of METRICS){ const c=(weights[m.key]||0)*(z[m.key][i]||0)/wsum; contrib[m.key]=c; rating+=c; }
    const missing=['last','form','track','distance','condition','career'].filter(k=>raw[k][i]==null).length;
    return {r, z:Object.fromEntries(METRICS.map(m=>[m.key,z[m.key][i]])), contrib, rating, missing}; });
  const beta=settings.beta||2.2; const ex=scored.map(s=>Math.exp(beta*s.rating)); const sum=ex.reduce((a,b)=>a+b,0)||1; scored.forEach((s,i)=>s.prob=ex[i]/sum);
  const order=[...scored].sort((a,b)=>b.rating-a.rating); order.forEach((s,i)=>s.rank=i+1);
  const imp=order.map(s=>{const o=num(s.r.odds); return o>1?1/o:null;}); const impSum=imp.reduce((a,b)=>a+(b||0),0);
  order.forEach((s,i)=>{ s.market= imp[i]!=null&&impSum>0 ? imp[i]/impSum : null; s.edge= s.market!=null ? s.prob-s.market : null; });
  return order;
}
function isValue(s,settings){ return s.edge!=null && s.market>=0.04 && s.prob>=0.08 && s.edge>=settings.valueEdge && s.prob/s.market>=1.25; }
function tier(p){ return p>=0.30?'Strong':p>=0.20?'Fair':'Skinny'; }
function kellyStake(s, settings){ const o=num(s.r.odds); if(!(o>1)) return 0; const b=o-1, q=1-s.prob; const f=(b*s.prob-q)/b; if(f<=0) return 0; return Math.max(0, Math.round(settings.bank*settings.kelly*f)); }
function modelAdvice(scored, settings){ const top=scored[0]; if(!top) return null; const second=scored[1];
  const value=[...scored].filter(s=>isValue(s,settings)).sort((a,b)=>b.edge-a.edge);
  return {top, tier:tier(top.prob), gap:second?top.prob-second.prob:top.prob, value:value[0]||null, valueAll:value, stakeTop:kellyStake(top,settings), stakeValue:value[0]?kellyStake(value[0],settings):0, roughie:bestRoughie(scored,settings)}; }
function multiHTML(multi, st){ if(!multi) return ''; return `<div class="banner"><div class="eyebrow" style="color:var(--panel-ink);opacity:.7">Best multi<span class="sl">/</span>${multi.legs.length} legs, model ${pct(multi.prob)}</div>
  <h2>${multi.legs.map(l=>`R${l.raceNo} ${cloth(l.no)}`).join(' ')}</h2><p>${multi.legs.map(l=>`R${l.raceNo} ${esc(l.name)} (${pct(l.prob)})`).join(', ')}.</p>
  <p>Our price $${(1/(multi.prob*Math.pow(st.book,multi.legs.length))).toFixed(1)} (fair $${multi.fair.toFixed(1)})${multi.odds?`, market pays about $${multi.odds.toFixed(1)}${multi.odds>multi.fair*1.1?' which is value':multi.odds<multi.fair*0.9?' which is under the odds':''}`:''}. Suggested stake ${fmtMoney(multi.stake)}.</p></div>`; }
function bestRoughie(scored, settings){ const cands=scored.filter(s=>num(s.r.odds)>=8&&num(s.r.odds)<=30&&s.prob>=0.05&&s.rank>1); if(!cands.length) return null;
  const byEdge=[...cands].filter(s=>s.edge!=null).sort((a,b)=>b.edge-a.edge); return byEdge[0]||[...cands].sort((a,b)=>b.prob-a.prob)[0]; }
function dayMulti(run, meeting, settings){ const legs=[]; for(const race of meeting.races){ if(race.result) continue; const top=(run.pred[race.no]||[])[0]&&(run.pred[race.no]||[]).find(x=>x.rank===1); if(!top) continue; const r=race.runners.find(h=>h.no===top.no); legs.push({raceNo:race.no,no:top.no,name:r?r.name:'',prob:top.prob,odds:num(r&&r.odds)}); }
  if(legs.length<2) return null; let pick=legs.filter(l=>l.prob>=0.28).sort((a,b)=>b.prob-a.prob).slice(0,4); if(pick.length<2) pick=[...legs].sort((a,b)=>b.prob-a.prob).slice(0,2);
  pick.sort((a,b)=>a.raceNo-b.raceNo); const prob=pick.reduce((a,l)=>a*l.prob,1); const odds=pick.every(l=>l.odds>1)?pick.reduce((a,l)=>a*l.odds,1):null;
  return {legs:pick, prob, odds, fair:1/prob, stake:Math.max(5,Math.round(settings.bank*0.02/5)*5)}; }
function effectivePick(punter, raceNo, run){ const o=punter.picks&&punter.picks[raceNo]&&punter.picks[raceNo].win; if(o) return {no:o, override:true}; const p=(run.pred[raceNo]||[]).find(x=>x.rank===1); return p?{no:p.no, override:false}:{no:null,override:false}; }

/* ---------------- run the day for one punter ----------------
   Replays results in race order. Returns adapted weights, per-race dynamics,
   the prediction each race carried when it was run, and the change log. */
function runDay(punter, meeting){
  const races=[...meeting.races].sort((a,b)=>a.no-b.no); const settings={...DEFAULT_SETTINGS,...punter.settings};
  let w={...punter.weights}; let formline={}, jockeyWins={}, barrierRel=[]; const dyn={}, pred={}, changes=[];
  for(const race of races){
    const fl={...formline}; for(const r of active(race)){ const jw=jockeyWins[normKey(r.jockey)]||0; if(jw>0){ const k=runnerKey(race,r); fl[k]=(fl[k]||0)+Math.min(0.4,0.2*jw); } }
    dyn[race.no]={formline:fl, barrierBias:barrierBiasFrom(barrierRel)};
    const scored=scoreRace(race,meeting,w,settings,dyn[race.no],punter.adj);
    pred[race.no]=scored.map(s=>({no:s.r.no,rank:s.rank,prob:s.prob}));
    const res=race.result; if(!res||!res.positions||!res.positions.length) continue;
    const pos=res.positions.map(Number); const n=scored.length; const win=scored.find(s=>s.r.no===pos[0]);
    // form lines, riders and barrier bias for later races
    for(const s of scored){ const idx=pos.indexOf(s.r.no); const actual=idx>=0?idx+1:(pos.length+1+n)/2; let resid=clamp((s.rank-actual)/Math.max(n/2,1),-1,1); if(idx===0) resid=Math.max(resid,0.15);
      const b=num(s.r.barrier); if(idx===0){ const j=normKey(s.r.jockey); if(j) jockeyWins[j]=(jockeyWins[j]||0)+1; if(b!=null&&n>1) barrierRel.push({rel:(b-1)/(n-1),w:1}); }
      if(idx===1&&b!=null&&n>1) barrierRel.push({rel:(b-1)/(n-1),w:0.5});
      const key=normKey(s.r.last&&s.r.last.race); if(!key||Math.abs(resid)<0.05) continue;
      for(const later of races){ if(later.no<=race.no) continue; for(const q of active(later)){ if(normKey(q.last&&q.last.race)!==key) continue;
        const qp=num(q.last.pos), rp=num(s.r.last.pos), qm=num(q.last.margin)||0, rm=num(s.r.last.margin)||0; let f=1; if(qp!=null&&rp!=null&&qp>rp) f=clamp(1-(qm-rm)/6,0.3,1);
        const k=runnerKey(later,q); formline[k]=clamp((formline[k]||0)+resid*settings.formlineGain*f,-1.5,1.5); } } }
    // weight adaptation on this punter's margin
    if(!win){ changes.push({race:race.no,text:`Winner ${pos[0]} not among active runners; no adaptation.`,items:[]}); continue; }
    const outside=win.rank>settings.marginRank||win.prob<settings.marginProb;
    const entry={race:race.no,text:`${win.r.name} won, rated ${ordinal(win.rank)} at ${pct(win.prob)}. ${outside?(settings.autoAdapt?'Outside the margin, weights moved.':'Outside the margin, adaptation is off.'):'Inside the margin, weights held.'}`,items:[]};
    if(outside&&settings.autoAdapt){ const pw=[3,2,1,0.5]; for(const met of METRICS){ if(met.key==='manual'||met.key==='formline') continue; let acc=0,sw=0; pos.slice(0,4).forEach((no,i)=>{ const s=scored.find(x=>x.r.no===no); if(!s) return; acc+=s.z[met.key]*pw[i]; sw+=pw[i]; }); if(!sw) continue;
      const perf=Math.tanh(acc/sw); const w0=w[met.key]; const w1=clamp(w0*(1+settings.lr*perf),met.base*0.15,met.base*2.5); if(Math.abs(w1-w0)>0.005){ w[met.key]=+w1.toFixed(3); entry.items.push(`${met.label} ${w0.toFixed(2)} to ${w1.toFixed(2)}`); } } }
    changes.push(entry);
  }
  return {weights:w, dyn, pred, changes, final:{barrierBias:barrierBiasFrom(barrierRel), jockeyWins}};
}
function barrierBiasFrom(list){ if(list.length<2) return 0; const sw=list.reduce((a,b)=>a+b.w,0); const mean=list.reduce((a,b)=>a+b.rel*b.w,0)/sw; const dev=0.5-mean; if(Math.abs(dev)<0.12) return 0; return clamp(dev*1.5,-0.6,0.6); }

/* ---------------- tips and leaderboard ---------------- */
function tipPoints(punter, meeting, run){ let pts=0, wins=0, places=0, tipped=0; run=run||runDay(punter,meeting);
  for(const race of meeting.races){ if(!race.result) continue; const pos=race.result.positions.map(Number); const ep=effectivePick(punter,race.no,run); const pk=punter.picks&&punter.picks[race.no];
    if(ep.no){ tipped++; if(pos[0]===ep.no){ pts+=3; wins++; } else if(pos.slice(1,3).includes(ep.no)){ pts+=1; places++; } }
    for(const p of ((pk&&pk.place)||[])){ if(pos.slice(0,3).includes(p)){ pts+=1; places++; } } }
  return {pts,wins,places,tipped}; }
function modelScore(run, meeting){ const done=meeting.races.filter(r=>r.result); let top=0,top3=0,placed=0;
  for(const r of done){ const p=run.pred[r.no]||[]; const wp=p.find(x=>x.no===r.result.positions[0]); if(wp&&wp.rank===1) top++; if(wp&&wp.rank<=3) top3++; const t=p.find(x=>x.rank===1); if(t&&r.result.positions.slice(0,3).includes(t.no)) placed++; }
  return {done:done.length,top,top3,placed}; }

/* ---------------- punters club ---------------- */
function placeOdds(b){ const po=num(b.placeOdds); if(po&&po>1) return po; const o=num(b.odds)||1; return +(1+(o-1)/4).toFixed(2); } // estimate where no place price entered
function settleBet(b, meeting){ const race=meeting.races.find(r=>r.no===b.raceNo); if(!race||!race.result) return {status:'open', ret:null};
  const pos=race.result.positions.map(Number); const won=pos[0]===b.runnerNo; const placed=pos.slice(0,3).includes(b.runnerNo); const st=num(b.stake)||0; let ret=0;
  if(b.type==='win') ret= won? st*(num(b.odds)||1) : 0;
  else if(b.type==='place') ret= placed? st*placeOdds(b) : 0;
  else { const half=st/2; ret=(won?half*(num(b.odds)||1):0)+(placed?half*placeOdds(b):0); }
  return {status: ret>0?'won':'lost', ret:+ret.toFixed(2)}; }
function clubBook(meeting){ let staked=0, ret=0, open=0; const rows=state.bets.map(b=>{ const s=settleBet(b,meeting); staked+=num(b.stake)||0; if(s.status==='open') open+=num(b.stake)||0; else ret+=s.ret; return {...b, ...s}; });
  return {rows, staked, ret, open, pl:+(ret-(staked-open)).toFixed(2)}; }
function fmtMoney(v){ return (v<0?'-':'')+'$'+Math.abs(v).toFixed(Math.abs(v)%1?2:0); }

/* ---------------- persistence ---------------- */
function persistLocal(){ try{ localStorage.setItem('kyw', JSON.stringify({meeting:state.meeting,punters:state.punters,me:state.me,comments:state.comments,bets:state.bets,updatedAt:state.updatedAt})); }catch(e){} }
function loadLocal(){ try{ const j=JSON.parse(localStorage.getItem('kyw')||'null'); if(j){ state.meeting=j.meeting||null; state.punters=j.punters||{}; state.me=j.me||null; state.comments=j.comments||[]; state.bets=j.bets||[]; state.updatedAt=j.updatedAt||0; return true; } }catch(e){} return false; }
function setSync(cls,txt){ const s=$('#sync'); s.className='sync '+cls; s.textContent=txt; }
// what = 'meeting' | 'punter' | 'result:<no>' | 'all'
function save(what){ state.updatedAt=Date.now(); if(me()) me().updatedAt=state.updatedAt; persistLocal(); render(); const w=what||'all';
  if(sb) sbPush(w); else if(db){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>pushDb(w==='all'?'all':(w.startsWith('result')?'meeting':w)),350); } }

/* ---- Supabase backend (web hosted) ---- */
async function sbInit(){
  if(!SUPABASE.url||!SUPABASE.key||!window.supabase) return false;
  sb=window.supabase.createClient(SUPABASE.url,SUPABASE.key,{global:{headers:{'x-flock-code':SUPABASE.flockCode}}});
  setSync('on','connecting');
  try{ await sbPullAll(true); setSync('on','live');
    sb.channel('kyw').on('postgres_changes',{event:'*',schema:'public',table:'kyw_meeting'},()=>sbPullMeeting().then(ch=>{ if(ch){ persistLocal(); render(); toast('Form updated'); } }))
      .on('postgres_changes',{event:'*',schema:'public',table:'kyw_results'},()=>sbPullResults().then(ch=>{ if(ch){ persistLocal(); render(); toast('Result in'); } }))
      .on('postgres_changes',{event:'*',schema:'public',table:'kyw_punters'},()=>sbPullPunters().then(ch=>{ if(ch){ persistLocal(); render(); } }))
      .on('postgres_changes',{event:'*',schema:'public',table:'kyw_comments'},()=>sbPullComments().then(()=>{ persistLocal(); render(); }))
      .on('postgres_changes',{event:'*',schema:'public',table:'kyw_bets'},()=>sbPullBets().then(()=>{ persistLocal(); render(); }))
      .subscribe(status=>{ if(status==='SUBSCRIBED') setSync('on','live'); else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setSync('err','live off, refresh to catch up'); });
    return true; }catch(e){ console.error(e); setSync('err','backend unreachable'); return false; }
}
async function sbPullMeeting(){ const {data,error}=await sb.from('kyw_meeting').select('*').eq('id','current').maybeSingle(); if(error) throw error;
  if(!data){ if(state.meeting&&!state.meeting.example){ state.meeting=null; return true; } return false; }
  const m=data.data; if(state.meeting&&(m.updatedAt||0)<=(state.meeting.updatedAt||0)&&state.meeting.id===m.id) return false;
  const results=state.meeting?Object.fromEntries(state.meeting.races.filter(r=>r.result).map(r=>[r.no,r.result])):{}; state.meeting=m; for(const r of m.races){ if(results[r.no]&&!r.result) r.result=results[r.no]; } return true; }
async function sbPullResults(){ if(!state.meeting) return false; const {data,error}=await sb.from('kyw_results').select('*').eq('meeting_id',state.meeting.id); if(error) throw error; let ch=false;
  for(const race of state.meeting.races){ const row=(data||[]).find(x=>x.race_no===race.no); const cur=race.result; if(row){ const res={positions:row.positions,by:row.entered_by,enteredAt:new Date(row.entered_at).getTime()}; if(!cur||JSON.stringify(cur.positions)!==JSON.stringify(res.positions)||cur.by!==res.by){ race.result=res; ch=true; } } else if(cur){ race.result=null; ch=true; } } return ch; }
async function sbPullPunters(){ const {data,error}=await sb.from('kyw_punters').select('*'); if(error) throw error; let ch=false; for(const row of (data||[])){ const p=row.data; if(p.id===state.me&&state.punters[p.id]&&(state.punters[p.id].updatedAt||0)>=(p.updatedAt||0)) continue; if(!state.punters[p.id]||(p.updatedAt||0)>(state.punters[p.id].updatedAt||0)){ state.punters[p.id]=p; ch=true; } } return ch; }
async function sbPullComments(){ const {data,error}=await sb.from('kyw_comments').select('*').order('created_at'); if(error) throw error; state.comments=(data||[]).map(r=>({id:r.id,raceNo:r.race_no,by:r.by,text:r.text,ts:new Date(r.created_at).getTime(),meetingId:r.meeting_id})); }

async function sbPullAll(first){ await sbPullMeeting(); await sbPullResults(); await sbPullPunters(); await sbPullComments(); await sbPullBets(); ensureRoster(); persistLocal(); render(); if(first&&me()) sbPush('punter'); }
async function sbPush(what){ try{ setSync('on','saving');

async function pushDb(what){
  if(!db) return; try{ setSync('on','saving');
    if((what==='all'||what==='meeting')&&state.meeting){ const m=state.meeting; const id=m.id||'current'; const meta={...m}; delete meta.races; meta.updatedAt=state.updatedAt;
      await db.doc('meetings/'+id).set(meta); for(const r of m.races) await db.doc('meetings/'+id+'/races/r'+r.no).set({...r,updatedAt:state.updatedAt});
      const snap=await db.collection('meetings/'+id+'/races').get(); for(const d of snap.docs){ if(!m.races.some(r=>'r'+r.no===d.id)) await db.doc('meetings/'+id+'/races/'+d.id).delete(); }
      await db.doc('settings/main').set({meetingId:id, updatedAt:state.updatedAt}); }
    if((what==='all'||what==='meeting')&&!state.meeting){ await db.doc('settings/main').set({meetingId:null, updatedAt:state.updatedAt}); }
    if((what==='all'||what==='punter')&&me()) await db.doc('punters/'+state.me).set(me());
    if(what==='all'||what==='meeting'){ await db.doc('shared/comments').set({items:state.comments}); await db.doc('shared/bets').set({items:state.bets}); }
    setSync('on','synced'); }catch(e){ console.error(e); setSync('err','sync failed'); } }
async function pullMeeting(){ const s=await db.doc('settings/main').get(); if(!s.exists) return false; const sd=s.data(); if(!sd.meetingId){ if(state.meeting&&(sd.updatedAt||0)>state.updatedAt){ state.meeting=null; return true; } return false; }
  const md=await db.doc('meetings/'+sd.meetingId).get(); if(!md.exists) return false; const meta=md.data(); if(state.meeting&&(meta.updatedAt||0)<=(state.meeting.updatedAt||0)) return false;
  const races=(await db.collection('meetings/'+sd.meetingId+'/races').get()).docs.map(d=>d.data()).sort((a,b)=>a.no-b.no); state.meeting={...meta,races};
  const c=await db.doc('shared/comments').get(); if(c.exists) state.comments=c.data().items||[]; const b=await db.doc('shared/bets').get(); if(b.exists) state.bets=b.data().items||[]; return true; }
async function initDb(){
  if(!window.claude||!window.claude.use) return; try{ db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ setSync('','this phone only'); return; } setSync('on','connecting');
  try{
    const changed=await pullMeeting();
    const ps=await db.collection('punters').get(); for(const d of ps.docs){ const p=d.data(); if(!state.punters[p.id]||(p.updatedAt||0)>(state.punters[p.id].updatedAt||0)) state.punters[p.id]=p; }
    ensureRoster(); persistLocal(); render();
    if(state.meeting&&!changed) pushDb('meeting'); if(me()) pushDb('punter');
    setSync('on','synced');
    db.doc('settings/main').onSnapshot(async snap=>{ if(!snap.exists||snap.metadata.hasPendingWrites) return; const c=await pullMeeting(); if(c){ persistLocal(); render(); toast('Form or results updated by another Pelican'); } }, e=>setSync('err','live sync off'));
    db.collection('punters').onSnapshot(snap=>{ let ch=false; for(const d of snap.docs){ const p=d.data(); if(p.id===state.me) continue; if(!state.punters[p.id]||(p.updatedAt||0)>(state.punters[p.id].updatedAt||0)){ state.punters[p.id]=p; ch=true; } } if(ch){ persistLocal(); render(); } }, e=>{});
    db.doc('shared/comments').onSnapshot(snap=>{ if(snap.exists&&!snap.metadata.hasPendingWrites){ state.comments=snap.data().items||[]; persistLocal(); render(); } }, e=>{});
    db.doc('shared/bets').onSnapshot(snap=>{ if(snap.exists&&!snap.metadata.hasPendingWrites){ state.bets=snap.data().items||[]; persistLocal(); render(); } }, e=>{});
    watchRaces();
  }catch(e){ console.error(e); setSync('err','sync failed'); }
}
let racesUnsub=null, racesWatched=null;
function watchRaces(){ if(!db||!state.meeting) return; const id=state.meeting.id; if(racesWatched===id) return; if(racesUnsub) racesUnsub(); racesWatched=id;
  racesUnsub=db.collection('meetings/'+id+'/races').onSnapshot(snap=>{ if(snap.metadata.hasPendingWrites||!state.meeting||state.meeting.id!==id) return; let ch=false;
    for(const d of snap.docs){ const r=d.data(); const i=state.meeting.races.findIndex(x=>x.no===r.no); if(i>=0&&(r.updatedAt||0)>(state.meeting.races[i].updatedAt||0)){ state.meeting.races[i]=r; ch=true; } }
    if(ch){ persistLocal(); render(); } }, e=>{}); }

function normaliseMeeting(j){
  if(!j||typeof j!=='object') throw new Error('Not an object'); if(Array.isArray(j)) j={races:j}; if(j.runners&&!j.races) j={races:[j]};
  const races=(j.races||[]).map((r,i)=>({ no:num(r.no)||num(r.race)||i+1, name:r.name||'', distance:num(r.distance), class:r.class||r.grade||'', time:r.time||'', result:(r.result&&r.result.positions)?r.result:null,
    runners:(r.runners||[]).map((h,k)=>({ no:num(h.no)||num(h.number)||k+1, name:h.name||('Runner '+(k+1)), barrier:num(h.barrier), weight:num(h.weight), jockey:h.jockey||'', trainer:h.trainer||'', age:h.age||null, sex:h.sex||'',
      career:rec(h.career), track:rec(h.track), distance:rec(h.distance), good:rec(h.good)||(h.condition&&rec(h.condition.good))||null, soft:rec(h.soft)||(h.condition&&rec(h.condition.soft))||null, heavy:rec(h.heavy)||(h.condition&&rec(h.condition.heavy))||null,
      form:h.form||'', last:h.last?{pos:num(h.last.pos),field:num(h.last.field),margin:num(h.last.margin),days:num(h.last.days),race:h.last.race||'',classChange:num(h.last.classChange)||0}:null,
      jockeyPct:num(h.jockeyPct), trainerPct:num(h.trainerPct), jockeyRating:num(h.jockeyRating), trainerRating:num(h.trainerRating), odds:num(h.odds), scratched:!!h.scratched, gear:h.gear||'', comment:h.comment||'' })) })).filter(r=>r.runners.length);
  if(!races.length) throw new Error('No races with runners found');
  return { id:slug((j.meeting||'meeting')+'-'+(j.date||Date.now())), meeting:j.meeting||j.track||'Meeting', date:j.date||'', condition:j.condition||'Good 4', rail:j.rail||'', example:!!j.example, races, log:j.log||[], updatedAt:Date.now() };
}
function parseCSV(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) throw new Error('CSV needs a header row and at least one runner');
  const split=l=>{ const out=[];let cur='',q=false; for(const ch of l){ if(ch==='"'){q=!q;continue;} if(ch===','&&!q){out.push(cur);cur='';continue;} cur+=ch;} out.push(cur); return out.map(s=>s.trim()); };
  const H=split(lines[0]).map(h=>h.toLowerCase().replace(/\s+/g,'_')); const races={};
  for(const l of lines.slice(1)){ const c=split(l); const g=k=>{const i=H.indexOf(k); return i>=0?c[i]:'';}; const rno=num(g('race'))||1;
    races[rno]=races[rno]||{no:rno,name:g('race_name'),distance:num(g('race_distance')),class:g('race_class'),time:g('race_time'),runners:[]}; if(!races[rno].distance&&g('race_distance')) races[rno].distance=num(g('race_distance'));
    races[rno].runners.push({no:num(g('no')),name:g('name'),barrier:num(g('barrier')),weight:num(g('weight')),jockey:g('jockey'),trainer:g('trainer'),career:g('career'),track:g('track'),distance:g('distance'),good:g('good'),soft:g('soft'),heavy:g('heavy'),form:g('form'),
      last:{pos:num(g('last_pos')),field:num(g('last_field')),margin:num(g('last_margin')),days:num(g('days')),race:g('last_race'),classChange:num(g('class_change'))},jockeyPct:num(g('jockey_pct')),trainerPct:num(g('trainer_pct')),odds:num(g('odds')),scratched:/^(y|true|1)/i.test(g('scratched'))}); }
  return {races:Object.values(races)}; }
function loadText(text){ text=text.trim(); const j=(text.startsWith('{')||text.startsWith('[')) ? JSON.parse(text) : parseCSV(text); const m=normaliseMeeting(j);
  state.meeting=m; resetSharedForNewMeeting(); state.ui.raceNo=m.races[0].no; state.ui.tab='races'; racesWatched=null; save('all'); watchRaces();
  const nr=m.races.reduce((a,r)=>a+r.runners.length,0); toast(`Loaded ${m.races.length} race${m.races.length===1?'':'s'}, ${nr} runner${nr===1?'':'s'}. Tips and calls reset.`); }
function mergeRace(text){ const j=JSON.parse(text.trim()); const one=normaliseMeeting(j.races?j:{races:[j]}); if(!state.meeting){ state.meeting=one; } else { for(const r of one.races){ const i=state.meeting.races.findIndex(x=>x.no===r.no); if(i>=0) state.meeting.races[i]=r; else state.meeting.races.push(r); } state.meeting.races.sort((a,b)=>a.no-b.no); } state.meeting.updatedAt=Date.now(); save('meeting'); toast('Race merged'); }

  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; }; const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const races=[]; let ni=0; const dists=[1100,1200,1400,1600,1200,2000,1400,1800]; const cls=['BM78','3YO F&M BM72','Open Hcp','G3 Hcp','Listed','BM88','2YO Plate','Open Hcp'];

  for(let r=1;r<=8;r++){ const n=ri(9,13); const runners=[]; const bars=[...Array(n).keys()].map(i=>i+1).sort(()=>rnd()-.5);
    for(let k=1;k<=n;k++){ const name=names[ni++%names.length]; const cs=ri(4,28), cw=ri(0,Math.max(1,Math.floor(cs*0.35))), cp=ri(0,Math.max(1,Math.floor((cs-cw)*0.4))); const ts=ri(0,6), ds=ri(0,8), gs=ri(2,cs); const j=J[ri(0,J.length-1)], t=T[ri(0,T.length-1)];
      const lp=ri(1,10), lm=lp===1?0:+(0.2+rnd()*6).toFixed(1); const form=['1','2','3','4','5','6','7','8','0','x'].sort(()=>rnd()-.5).slice(0,ri(3,5)).join('')+lp; const odds=+(2.2+Math.pow(rnd(),2)*38).toFixed(1);
      runners.push({no:k,name,barrier:bars[k-1],weight:+(53+rnd()*7).toFixed(1),jockey:j[0],trainer:t[0],age:ri(3,7),sex:['G','M','H'][ri(0,2)],career:[cs,cw,cp],track:[ts,ri(0,Math.min(ts,2)),ri(0,Math.min(ts,2))],distance:[ds,ri(0,Math.min(ds,3)),ri(0,Math.min(ds,3))],
        good:[gs,ri(0,Math.min(gs,cw)),ri(0,Math.min(gs,cp))],soft:[ri(0,5),ri(0,1),ri(0,2)],heavy:[ri(0,3),ri(0,1),ri(0,1)],form,last:{pos:lp,field:ri(Math.max(lp,8),14),margin:lm,days:ri(7,60),race:lastRaces[ri(0,lastRaces.length-1)],classChange:ri(-1,1)},jockeyPct:j[1],trainerPct:t[1],odds,scratched:rnd()<0.06,gear:rnd()<0.15?'Blinkers first time':'',comment:''}); }
    races.push({no:r,name:['Opening Sprint','Fillies and Mares','Spring Handicap','Mile Stakes','Sprint Stakes','Staying Handicap','Juvenile Plate','Closing Handicap'][r-1],distance:dists[r-1],class:cls[r-1],time:`${11+Math.floor((r+1)/2)}:${(r%2)?'40':'15'}`,runners}); }
  return {id:'example-fictional', meeting:'Example meeting (fictional)', date:'', condition:'Good 4', rail:'True', example:true, races, log:[], updatedAt:Date.now()};
}

function viewFlock(){
  const m=state.meeting; const ps=Object.values(state.punters);
  const runs={}; for(const p of ps) runs[p.id]=runDay(p,m);
  const bookAll=clubBook(m); const plBy={}; for(const b of bookAll.rows){ if(b.status==='open') continue; plBy[b.by]=(plBy[b.by]||0)+(b.ret-(num(b.stake)||0)); }
  const rows=ps.map(p=>({p, tips:tipPoints(p,m,runs[p.id]), model:modelScore(runs[p.id],m), pl:plBy[p.name]||0})).sort((a,b)=>b.pl-a.pl||b.tips.pts-a.tips.pts);
  let html=`<div class="eyebrow">Who won what<span class="sl">/</span>${ps.length} Pelican${ps.length===1?'':'s'}</div><p class="note" style="margin:6px 0 10px">Settled club bets by the Pelican who put them on. Tip points alongside: three for a winner, one for a place, on each Pelican's model tip or override.</p><div class="board">`;
  rows.forEach((r,i)=>{ html+=`<div class="brow"><span class="pos num">${i+1}</span><span>${pelChip(r.p)}${r.p.id===state.me?' <span class="tag acc">you</span>':''}<div class="sub">${r.tips.wins} winner${r.tips.wins===1?'':'s'}, ${r.tips.places} placed from ${r.tips.tipped} tips, ${r.tips.pts} pts</div></span><span class="sub num">model ${r.model.top}/${r.model.done}</span><span class="pts num" style="color:${r.pl>0?'var(--good)':r.pl<0?'var(--bad)':'inherit'}">${r.pl?fmtMoney(r.pl):'-'}</span></div>`; });
  html+=`</div>`;
  html+=`<section class="block" style="margin-top:22px"><div class="eyebrow">Tips board<span class="sl">/</span>each model's tip by race, ringed orange where overridden</div><div class="tipsboard" style="margin-top:8px"><table><thead><tr><th style="text-align:left">Race</th>${ps.map(p=>`<th>${avatarSVG(p.avatar||'plain',p.colour,'sm')}<br>${esc(p.name)}</th>`).join('')}<th>Result</th></tr></thead><tbody>`;
  for(const r of m.races){ const win=r.result&&r.result.positions[0]; html+=`<tr><td>${r.no}</td>${ps.map(p=>{const e=effectivePick(p,r.no,runs[p.id]); const t=e.no; return `<td>${t?`<span class="${win===t?'hit':''}" style="display:inline-block;border-radius:6px;${e.override?'outline:2px solid var(--accent);outline-offset:-2px':''}">${cloth(t)}</span>`:'<span class="small">-</span>'}</td>`;}).join('')}<td>${win?cloth(win):'<span class="small">-</span>'}</td></tr>`; }
  html+=`</tbody></table></div></section>`;
  const done=m.races.filter(r=>r.result).sort((a,b)=>b.no-a.no);
  html+=`<section class="block" style="margin-top:22px"><div class="eyebrow">Results<span class="sl">/</span>newest first</div>`;
  if(!done.length) html+=`<p class="note">Nothing in yet.</p>`;
  for(const r of done){ const w=r.runners.find(h=>h.no===r.result.positions[0]); const tippers=ps.filter(p=>effectivePick(p,r.no,runs[p.id]).no===r.result.positions[0]);
    html+=`<div class="logrow"><div class="when">Race ${r.no}${r.result.by?' entered by '+esc(r.result.by):''}</div>${cloth(r.result.positions[0])} <b>${esc(w?w.name:'')}</b> from ${r.result.positions.slice(1).join(', ')}.${tippers.length?`<div class="flock" style="margin-top:6px">${tippers.map(p=>pelChip(p)).join('')} <span class="small">tipped it</span></div>`:''}</div>`; }
  html+=`</section>`;
  const book=clubBook(m);
  html+=`<section class="block"><div class="eyebrow">Punters club<span class="sl">/</span>${book.rows.length} bet${book.rows.length===1?'':'s'}</div>
  <div class="kpis" style="margin-top:8px"><div class="kpi"><b class="num">${fmtMoney(book.staked)}</b><span>Staked</span></div><div class="kpi"><b class="num">${fmtMoney(book.ret)}</b><span>Returned</span></div><div class="kpi"><b class="num" style="color:${book.pl>0?'var(--good)':book.pl<0?'var(--bad)':'inherit'}">${fmtMoney(book.pl)}</b><span>Settled P&amp;L</span></div></div>`;
  if(book.open>0) html+=`<p class="small" style="margin-top:6px">${fmtMoney(book.open)} still running.</p>`;
  const byP={}; for(const b of book.rows){ byP[b.by]=(byP[b.by]||0)+(num(b.stake)||0); } const contrib=Object.entries(byP); const silent=ps.filter(p=>!byP[p.name]);
  if(contrib.length) html+=`<div class="flock" style="margin:8px 0">${contrib.map(([n,v])=>{const p=punterByName(n);return `<span class="pel">${avatarSVG(p.avatar||'plain',p.colour,'sm')}${esc(n)} ${fmtMoney(v)}</span>`;}).join('')}</div>`;
  if(silent.length&&book.rows.length) html+=`<p class="small">Yet to put anything on: ${silent.map(p=>esc(p.name)).join(', ')}.</p>`;
  for(const b of [...book.rows].reverse()){ const race=m.races.find(r=>r.no===b.raceNo); const h=race&&race.runners.find(x=>x.no===b.runnerNo); const p=punterByName(b.by);
    const amt= b.status==='open'? fmtMoney(b.stake) : (b.ret>0? '+'+fmtMoney(b.ret-b.stake) : '-'+fmtMoney(b.stake));
    html+=`<div class="betrow">${avatarSVG(p.avatar||'plain',p.colour,'sm')}<span><b>R${b.raceNo}</b> ${cloth(b.runnerNo)} ${esc(h?h.name:'')} <span class="s">${b.type==='ew'?'each way':b.type} ${fmtMoney(b.stake)}${b.odds?' @ '+b.odds:''}${b.type!=='win'?' (place '+placeOdds(b)+(b.placeOdds?'':' est.')+')':''} by ${esc(b.by)}${b.note?', '+esc(b.note):''}</span></span><span class="amt num ${b.status==='won'?'pos':b.status==='lost'?'neg':''}">${amt}${b.status==='open'&&b.by===me().name?` <button class="btn" style="padding:2px 8px;font-size:11px" data-act="delbet" data-id="${esc(b.id)}">x</button>`:''}</span></div>`; }
  if(!book.rows.length) html+=`<p class="note">No club bets recorded. Open a runner on the race screen to put one on the book.</p>`;
  html+=`<p class="small" style="margin-top:8px">Place returns use the place price you enter, or a quarter of the win odds where none is given, so treat those as estimates.</p></section>`;
  html+=`<div class="actions"><button class="btn" data-act="switch">Switch Pelican</button></div>`;
  return html;
}

function viewLoad(){
  const m=state.meeting;
  return `<div class="eyebrow">Load form<span class="sl">/</span>JSON or CSV</div>
  <p class="note" style="margin:8px 0 12px">Paste the finalised form as JSON in the schema below, or as CSV with the listed columns. Loading replaces the current meeting for every Pelican and clears tips and calls. ${m?`Current meeting: ${esc(m.meeting)} (${m.races.length} races).`:''}</p>
  <label class="field">Form data<textarea id="loadIn" placeholder="Paste JSON or CSV here"></textarea></label>
  <div class="actions"><button class="btn primary" data-act="load">Load as new meeting</button><button class="btn" data-act="mergerace">Add or replace one race</button><button class="btn" id="convertBtn" data-act="convert" hidden>Convert raw form text with Claude</button></div>
  <p class="small" id="convertNote" hidden>Converting sends the pasted text to Claude from this page and asks for JSON in the schema. A full meeting can take a minute. Check the runner counts after it loads.</p>
  <section class="block" style="margin-top:22px"><div class="eyebrow">Other ways in</div>
  <div class="actions"><button class="btn" data-act="copyprompt">Copy conversion prompt for Claude</button><button class="btn" data-act="copyjson" ${m?'':'disabled'}>Copy current meeting as JSON</button><button class="btn" data-act="example">Load fictional example</button><button class="btn danger" data-act="clear" ${m?'':'disabled'}>Clear meeting</button></div>
  <p class="small">The conversion prompt carries the schema and the rules. Paste it into Claude with the form guide text or PDF, then paste the JSON it returns here.</p></section>
  <section class="block"><div class="eyebrow">JSON schema</div><pre class="schema">${esc(SCHEMA_DOC)}</pre>
  <p class="small">Records are [starts, wins, placings]. Form reads oldest to newest with the most recent run last. Omit or null anything not in the form; that metric is then neutral for the runner.</p></section>
  <section class="block"><div class="eyebrow">CSV columns</div><pre class="schema">race, race_name, race_distance, race_class, race_time, no, name, barrier, weight, jockey, trainer,
career, track, distance, good, soft, heavy   (each as 20-4-7 for starts-wins-placings)
form, last_pos, last_field, last_margin, days, last_race, class_change, jockey_pct, trainer_pct, odds, scratched</pre></section>`;
}

/* ---------------- events ---------------- */
function bind(root){
  root.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('change',()=>{ state.meeting[el.dataset.meta]=el.value; state.meeting.updatedAt=Date.now(); save('meeting'); }));
  root.querySelectorAll('[data-act="weight"]').forEach(el=>{ el.addEventListener('input',()=>{ me().weights[el.dataset.key]=+el.value; el.closest('.wrow').querySelector('.l span').textContent=(+el.value).toFixed(2); }); el.addEventListener('change',()=>save('punter')); });
  root.querySelectorAll('[data-act="setting"]').forEach(el=>{ const h=()=>{ me().settings[el.dataset.key]= el.type==='checkbox'?el.checked:+el.value; }; el.addEventListener('input',()=>{ h(); const sp=el.closest('.wrow').querySelector('.l span'); if(sp&&el.type!=='checkbox'){ const k=el.dataset.key; sp.textContent= k==='marginProb'?pct(+el.value):k==='marginRank'?el.value:k==='bank'?fmtMoney(+el.value):k==='valueEdge'?(+el.value*100).toFixed(0)+' pts':k==='book'?Math.round(+el.value*100)+'%':(+el.value).toFixed(2); } }); el.addEventListener('change',()=>{ h(); save('punter'); }); });
  root.querySelectorAll('[data-act="adj"]').forEach(el=>{ el.addEventListener('input',()=>{ el.nextElementSibling.textContent=(+el.value>0?'+':'')+el.value; }); el.addEventListener('change',()=>{ const a=me().adj[el.dataset.key]||(me().adj[el.dataset.key]={adj:0,note:''}); a.adj=+el.value; save('punter'); }); });
  root.querySelectorAll('[data-act="note"]').forEach(el=>el.addEventListener('change',()=>{ const a=me().adj[el.dataset.key]||(me().adj[el.dataset.key]={adj:0,note:''}); a.note=el.value; save('punter'); }));
  const conv=$('#convertBtn'); if(conv&&sampleFn){ conv.hidden=false; $('#convertNote').hidden=false; }
}
function currentRace(){ return state.meeting.races.find(r=>r.no===state.ui.raceNo); }
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  if(act==='tab'){ state.ui.tab=b.dataset.tab; render(); }
  else if(act==='openrace'){ state.ui.raceNo=+b.dataset.no; state.ui.tab='race'; state.ui.open=null; render(); window.scrollTo(0,0); }
  else if(act==='toggle'){ state.ui.open= state.ui.open===b.dataset.key?null:b.dataset.key; render(); }
  else if(act==='scratch'){ const r=currentRace().runners.find(x=>x.no===+b.dataset.no); r.scratched=!r.scratched; currentRace().updatedAt=Date.now(); save('meeting'); }
  else if(act==='tipwin'){ const race=currentRace(); const run=runDay(me(),state.meeting); const model=effectivePick({...me(),picks:{}},race.no,run).no; const pk=me().picks[race.no]||(me().picks[race.no]={win:null,place:[]}); const no=+b.dataset.no;
    if(pk.win===no||no===model){ pk.win=null; toast(no===model&&pk.win!==no?'That is the model tip already':'Back to the model tip'); } else { pk.win=no; toast('Override set. The model tip stands for scoring only if you clear this.'); } pk.place=(pk.place||[]).filter(n=>n!==pk.win); save('punter'); }
  else if(act==='tipplace'){ const race=currentRace(); const pk=me().picks[race.no]||(me().picks[race.no]={win:null,place:[]}); const no=+b.dataset.no; pk.place=pk.place||[]; if(pk.place.includes(no)) pk.place=pk.place.filter(n=>n!==no); else { if(pk.place.length>=2){ toast('Two place tips per race'); return; } if(pk.win===no) pk.win=null; pk.place.push(no); } save('punter'); }
  else if(act==='result'){ const v=$('#resIn').value.trim(); const pos=v.split(/[^0-9]+/).filter(Boolean).map(Number); if(!pos.length){ toast('Enter the finishing order first'); return; } if(new Set(pos).size!==pos.length){ toast('A number is repeated'); return; }
    const race=currentRace(); const known=new Set(active(race).map(r=>r.no)); const bad=pos.filter(n=>!known.has(n)); if(bad.length){ toast('Not in this field: '+bad.join(', ')); return; }
    race.result={positions:pos, enteredAt:Date.now(), by:me().name}; race.updatedAt=Date.now(); state.meeting.updatedAt=Date.now(); save('result:'+race.no); toast('Result in. Every model on the card has been updated.'); }
  else if(act==='clearresult'){ const race=currentRace(); race.result=null; race.updatedAt=Date.now(); state.meeting.updatedAt=Date.now(); save('result:'+race.no); }
  else if(act==='resetweights'){ me().weights=Object.fromEntries(METRICS.map(m=>[m.key,m.base])); save('punter'); }
  else if(act==='load'){ try{ loadText($('#loadIn').value); }catch(err){ toast('Could not read that: '+err.message); } }
  else if(act==='mergerace'){ try{ mergeRace($('#loadIn').value); }catch(err){ toast('Could not read that: '+err.message); } }
  else if(act==='example'){ state.meeting=exampleMeeting(); resetSharedForNewMeeting(); state.ui.raceNo=1; state.ui.tab='races'; racesWatched=null; save('all'); watchRaces(); }
  else if(act==='clear'){ if(!confirm('Clear the current meeting, results, comments and club bets for every Pelican?')) return; state.meeting=null; resetSharedForNewMeeting(); save('meeting'); }
  else if(act==='copyprompt'){ await copy(CONVERT_RULES+SCHEMA_DOC); toast('Conversion prompt copied'); }
  else if(act==='copyjson'){ await copy(JSON.stringify(state.meeting,null,1)); toast('Meeting JSON copied'); }
  else if(act==='convert'){ await convertWithClaude(); }
  else if(act==='switch'){ state.me=null; persistLocal(); render(); }
  else if(act==='comment'){ const t=$('#commentIn').value.trim(); if(!t) return; try{ await addComment(state.ui.raceNo,t); }catch(e){} }
  else if(act==='delcomment'){ await deleteComment(b.dataset.id); }
  else if(act==='betopen'){ state.ui.betOn=b.dataset.key||null; render(); }
  else if(act==='betsave'){ const race=currentRace(); const runnerNo=+b.dataset.no; const type=$('#betType').value; const stake=num($('#betStake').value); const odds=num($('#betOdds').value); const placeOddsV=num($('#betPlace').value); const note=$('#betNote').value.trim();
    if(!stake||stake<=0){ toast('Stake first'); return; } if(type!=='place'&&(!odds||odds<=1)){ toast('Win odds needed for a win or each way bet'); return; }
    const dup=clubOn(runnerNo,race.no).filter(x=>x.type===type); if(dup.length&&!confirm(`${dup.map(d=>d.by+' has '+fmtMoney(d.stake)).join(', ')} already ${type==='ew'?'each way':type} on this runner. Record another?`)) return;
    try{ await addBet({raceNo:race.no,runnerNo,type,stake,odds,placeOdds:placeOddsV,note}); state.ui.betOn=null; render(); toast('On the book'); }catch(e){} }
  else if(act==='delbet'){ if(!confirm('Take this bet off the book?')) return; await deleteBet(b.dataset.id); }
});
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
async function copy(text){ try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } }

/* ---------------- Claude conversion (sample capability) ---------------- */
async function convertWithClaude(){
  const raw=$('#loadIn').value.trim(); if(!raw){ toast('Paste the raw form text first'); return; } if(!sampleFn){ toast('Conversion is not available in this view'); return; }
  const btn=$('#convertBtn'); btn.disabled=true; btn.textContent='Converting...';
  try{ const out=await sampleFn.json(CONVERT_RULES+SCHEMA_DOC+'\n\nForm guide text:\n'+raw,{modelTier:'complex'}); $('#loadIn').value=JSON.stringify(out,null,1); toast('Converted. Check it over, then load it.'); }
  catch(err){ toast('Conversion failed: '+(err&&err.message||err.code||'unknown')); }
  finally{ btn.disabled=false; btn.textContent='Convert raw form text with Claude'; }
}

/* ---------------- boot ---------------- */
(async function boot(){
  loadLocal(); ensureRoster(); let seen=false; try{ seen=!!localStorage.getItem('kyw_seen'); localStorage.setItem('kyw_seen','1'); }catch(e){} if(!state.meeting&&!seen) state.meeting=exampleMeeting();
  render(); const web=await sbInit(); if(!web) initDb();
  if(window.claude&&window.claude.use){ window.claude.use('sample').then(s=>{ sampleFn=s; if(s&&state.ui.tab==='load') render(); }).catch(()=>{}); }
})();
</script>
